name: Build Heroium (Web)

# Exporta Heroium ca build Web (WebGL2), care ruleaza direct in browser -
# fara Godot instalat nicaieri, la fel cum functioneaza deja Torchbound.
# Godot in sine (editorul) nu poate rula pe telefon, dar acest workflow
# foloseste binarul headless al Godot, nu editorul cu interfata grafica.
#
# DOAR MANUAL, intentionat: jocul e inca in dezvoltare.
#   tab-ul Actions -> "Build Heroium (Web)" -> Run workflow.
# Rezultatul e publicat direct in repo, sub games/heroium/play/, de unde
# GitHub Pages il serveste automat (aceeasi sursa ca Torchbound).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exporta build-ul Web cu Godot 4.3 headless
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./games/heroium
          archive_output: false
          presets_to_export: "Web"
          cache: true

      - name: Publică build-ul în games/heroium/play/
        run: |
          rm -rf games/heroium/play
          mkdir -p games/heroium/play
          cp -r "${{ steps.export.outputs.build_directory }}/Web/." games/heroium/play/
          # play/ sta inauntrul proiectului Godot, dar e rezultat de build, nu
          # sursa: fara .gdignore, exportul urmator i-ar importa imaginile si
          # le-ar impacheta in joc, build dupa build.
          touch games/heroium/play/.gdignore

      - name: Commit build-ul jucabil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/heroium/play
          if git diff --cached --quiet; then
            echo "Nimic nou de publicat."
            exit 0
          fi
          git commit -m "Publish Heroium web build [skip ci]"
          git push
