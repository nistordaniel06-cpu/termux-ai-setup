name: Booking Platform CI

on:
  push:
    branches: [main]
    paths:
      - "booking-platform/**"
      - ".github/workflows/booking-platform-ci.yml"
  pull_request:
    paths:
      - "booking-platform/**"
      - ".github/workflows/booking-platform-ci.yml"

defaults:
  run:
    working-directory: booking-platform

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://booking:booking@localhost:5432/booking_platform_test?schema=public
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      PORT: 4001
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booking-platform/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace packages/api

      - name: Apply migrations to the test database
        run: npm run prisma:migrate --workspace packages/api

      - name: Type-check / build
        run: npm run api:build

      - name: Run tests
        run: npm run api:test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booking-platform/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run web:build
