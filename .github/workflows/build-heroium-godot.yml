name: Build Heroium (Godot)

# Exporta Heroium ca build Web (WebGL2), care ruleaza direct in browser -
# fara Godot instalat nicaieri.
# Godot in sine (editorul) nu poate rula pe telefon, dar acest workflow
# foloseste binarul headless al Godot, nu editorul cu interfata grafica.
#
# DOAR MANUAL, intentionat: jocul e inca in dezvoltare.
#   tab-ul Actions -> "Build Heroium (Godot)" -> Run workflow.
# Rezultatul e publicat direct in repo, sub games/heroium/play/, de unde
# GitHub Pages il serveste automat.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  # Jocul a plecat odata cu tot stratul de scripturi necompilabil, iar buildul a
  # reusit oricum - un export nu verifica daca jocul chiar merge. De aceea acum
  # trece intai prin teste, si abia daca ele trec se mai exporta ceva.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ia Godot ${{ env.GODOT_VERSION }} headless
        run: |
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Importa proiectul
        # Prima trecere la rece se plange de iconita pluginului de editor, care
        # nu are treaba cu jocul exportat; a doua trecere e cea care conteaza.
        run: |
          "$GODOT" --headless --path games/heroium --import || true
          "$GODOT" --headless --path games/heroium --import

      - name: Ruleaza testele
        run: |
          "$GODOT" --headless --path games/heroium --script res://tests/run_tests.gd

  export_web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exporta build-ul Web cu Godot 4.3 headless
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./games/heroium
          archive_output: false
          presets_to_export: "Web"
          cache: true

      - name: Publică build-ul în games/heroium/play/
        run: |
          rm -rf games/heroium/play
          mkdir -p games/heroium/play
          cp -r "${{ steps.export.outputs.build_directory }}/Web/." games/heroium/play/
          # play/ sta inauntrul proiectului Godot, dar e rezultat de build, nu
          # sursa: fara .gdignore, exportul urmator i-ar importa imaginile si
          # le-ar impacheta in joc, build dupa build.
          touch games/heroium/play/.gdignore

      - name: Commit build-ul jucabil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/heroium/play
          if git diff --cached --quiet; then
            echo "Nimic nou de publicat."
            exit 0
          fi
          git commit -m "Publish Heroium web build [skip ci]"
          git push
