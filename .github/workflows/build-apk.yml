name: Build Torchbound APK

# Construieste APK-ul in cloud, ca sa nu fie nevoie de PC.
# Pornire manuala: tab-ul Actions -> "Build Torchbound APK" -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'games/torchbound/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/torchbound

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instaleaza dependintele
        run: npm install --no-audit --no-fund

      - name: Genereaza proiectul Android
        run: npx cap add android

      - name: Blocheaza orientarea pe portret
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' "$MANIFEST"
          grep -q 'screenOrientation' "$MANIFEST" && echo "orientare blocata pe portret" || echo "atentie: nu am putut seta orientarea"

      - name: Copiaza jocul in proiect
        run: npx cap sync android

      - name: Compileaza APK-ul
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Publica APK-ul ca artifact
        uses: actions/upload-artifact@v4
        with:
          name: torchbound-apk
          path: games/torchbound/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
