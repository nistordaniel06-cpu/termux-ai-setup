version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      # One PR for all action bumps instead of one PR per action.
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /booking-platform
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    ignore:
      # Node 22 is the CI baseline; major bumps need a deliberate upgrade.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
